name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # 仅保留 Windows
        build_type: [RelWithDebInfo]  # 仅 Release 构建
        ui: [gui]  # 仅 GUI 版本
        scripting: [lua]  # 只保留有效脚本选项（原排除规则已过滤 noscripts）
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia
    - uses: aseprite/get-ninja@main
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=off  # Windows 关闭 ccache
        export laf_backend=skia
        export enable_scripting=on
        export skia_arch=x64
        
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DLAF_BACKEND=$laf_backend \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
    - name: Compiling
      shell: bash
      run: cd build && ninja
    - name: Running C++ Tests
      shell: bash
      run: cd build && ctest --output-on-failure
    - name: Running CLI Tests
      shell: bash
      run: |
        export ASEPRITE=$PWD/build/bin/aseprite
        cd tests
        bash run-tests.sh
    - name: Create Release Package
      shell: cmd
      run: |
        mkdir package
        xcopy /Y build\bin\aseprite.exe package\
        xcopy /Y build\bin\*.dll package\
        :: 如果需要包含其他资源文件
        xcopy /Y data\* package\data\ /E
        cd package
        :: 使用7-zip压缩（需预安装）
        "C:\Program Files\7-Zip\7z.exe" a ../aseprite-${{ github.run_id }}.zip *
      env:
        PATH: ${{ env.PATH }};C:\Program Files\7-Zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprice-package
        path: |
          aseprite-${{ github.run_id }}.zip
          build/aseprite.sym  # 如果需要包含调试符号
